<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0756a4">
    <meta name="description" content="YSRCP CHKP campaign">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png?v=2">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="YSRCP CHKP Campaign">
    <meta property="og:title" content="YSRCP CHKP Campaign">
    <meta property="og:description" content="Campaign updates, photos and videos from CHKP Village.">
    <meta property="og:image" content="https://raw.githubusercontent.com/indurirakeyshreddy/ysrcp-chkp/main/share-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="YSRCP CHKP Village Campaign fan logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="YSRCP CHKP Campaign">
    <meta name="twitter:description" content="Campaign updates, photos and videos from CHKP Village.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/indurirakeyshreddy/ysrcp-chkp/main/share-card.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>YSRCP CHKP Campaign</title>
    <link rel="stylesheet" href="styles.css?v=32">
    <script>
      (async () => {
        const status = document.querySelector("#home-status");
        const errorMessage = document.querySelector("#home-error");
        try {
          const response = await fetch(`campaign-config.yaml?updated=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`campaign-config.yaml returned HTTP ${response.status}.`);
          }
          const yaml = await response.text();
          const setting = yaml.match(/^\s*activeElection\s*:\s*["']?([a-z]+)["']?\s*(?:#.*)?$/mi);
          const election = setting?.[1]?.toLowerCase() || "";
          if (!["mptc", "zptc", "panchayat", "mla", "mp"].includes(election)) {
            throw new Error(`Unknown activeElection "${election}". Choose mptc, zptc, panchayat, mla, or mp.`);
          }
          window.location.replace(`${election}/index.html`);
        } catch (error) {
          console.error("Unable to open the active election campaign.", error);
          status.hidden = true;
          errorMessage.textContent = `The active campaign could not be opened: ${error.message}`;
          errorMessage.hidden = false;
        }
      })();
    </script>
  </head>
  <body>
    <main class="active-home-message">
      <svg class="symbol-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="ceiling-fan-symbol" viewBox="0 0 100 100">
          <path class="fan-stem" d="M46 2h8v7l-3 5v30h-2V14l-3-5z"></path>
          <g class="fan-blades">
            <path d="M46 48c-2-9-8-21-7-32 1-7 6-11 12-10 6 0 10 5 9 12-1 11-6 21-7 30z"></path>
            <path d="M46 48c-2-9-8-21-7-32 1-7 6-11 12-10 6 0 10 5 9 12-1 11-6 21-7 30z" transform="rotate(120 50 54)"></path>
            <path d="M46 48c-2-9-8-21-7-32 1-7 6-11 12-10 6 0 10 5 9 12-1 11-6 21-7 30z" transform="rotate(240 50 54)"></path>
          </g>
          <circle class="fan-hub" cx="50" cy="54" r="8"></circle>
        </symbol>
      </svg>
      <svg class="fan-symbol fan-logo" aria-hidden="true"><use href="#ceiling-fan-symbol"></use></svg>
      <p id="home-status">Opening the active YSRCP campaign…</p>
      <p id="home-error" role="alert" hidden></p>
    </main>
  </body>
</html>
